# Production-like stack for load testing on a single VPS. Synthetic data only.
#
#   docker compose -f loadtest/docker-compose.yml up -d --build
#
# Tune WORKER_COUNT to the box: about 2-3 per vCPU.
name: clubs-loadtest

x-app-env: &app-env
  DEV: "false"
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: "*"
  DJANGO_BASE_URL: "http://localhost:9000"
  CSRF_TRUSTED_ORIGINS: "http://localhost:9000"
  DJANGO_SUPERUSER_EMAIL: "admin@example.edu"
  DJANGO_SUPERUSER_PASS: "${LOADTEST_ADMIN_PASS:?set LOADTEST_ADMIN_PASS}"
  DJANGO_CREATE_SUPERUSER: "1"
  DJANGO_CONSOLE_EMAIL_BACKEND: "1"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_NAME: clubs
  POSTGRES_USER: clubs
  POSTGRES_PASSWORD: clubs
  POSTGRES_MAX_POOL_SIZE: "${POSTGRES_MAX_POOL_SIZE:-4}"
  REDIS_HOST: redis
  S3_STORAGE_BACKEND: "0"
  SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0}"

services:
  app:
    build:
      context: ..
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "9000"
      WORKER_COUNT: "${WORKER_COUNT:-3}"
    ports:
      - "9000:9000"
    depends_on: [postgres, redis]

  celery:
    build:
      context: ..
    restart: unless-stopped
    user: django-user
    command: ["celery", "-A", "app", "worker", "--loglevel=warning", "--concurrency=1"]
    environment: *app-env
    depends_on: [postgres, redis]

  postgres:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clubs
      POSTGRES_USER: clubs
      POSTGRES_PASSWORD: clubs
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: unless-stopped

volumes:
  postgres:
